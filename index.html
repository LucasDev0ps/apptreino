<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lumis Fitness</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0D0D0D;
      color: #FFFFFF;
      margin: 0;
      padding: 0;
    }
    nav {
      background: #1C1C1E;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    nav img { height: 30px; margin-right: 10px; }
    nav span { font-weight: 600; font-size: 18px; }
    .container { padding: 20px; }
    .card {
      background: #1C1C1E;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .card h3 { margin: 0 0 10px 0; }
    .progress-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 6px solid #007AFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }
    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #1C1C1E;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid #2C2C2E;
    }
    footer button {
      background: none;
      border: none;
      color: #8E8E93;
      font-size: 22px;
    }
    footer button.active { color: #007AFF; }
    .add-btn {
      position: fixed;
      bottom: 70px;
      right: 20px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50%;
      width: 55px;
      height: 55px;
      font-size: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <nav>
    <div style="display:flex;align-items:center;">
      <img src="logo.png" alt="Lumis Fitness">
      <span>Lumis Fitness</span>
    </div>
    <div style="font-size:24px;">👤</div>
  </nav>

  <div class="container">
    <h2>Dashboard</h2>
    <div class="card">
      <h3>Seu progresso semanal</h3>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <p><strong>3 de 4</strong> Treinos concluídos</p>
          <p>Semana 12: 15 Set - 21 Set</p>
        </div>
        <div class="progress-circle">75%</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;">
      <div class="card">
        <h3>Resumo geral</h3>
        <p>Treino: 5h 30m</p>
        <p>Cardio: 120 min</p>
        <p>Peso: 81.5 kg</p>
      </div>
      <div class="card">
        <h3>Recorde recente</h3>
        <p>Supino reto: 90kg (5x10)</p>
      </div>
    </div>

    <div class="card">
      <h3>Treino de hoje</h3>
      <p>Peito & Tríceps (Foco força)</p>
    </div>
  </div>

  <button class="add-btn">+</button>

  <footer>
    <button class="active">🏠</button>
    <button>🏋️</button>
    <button>📊</button>
    <button>👤</button>
  </footer>
</body>
</html>
